name: Deploy GitHub Pages

on:
  push:
    branches:
      - claude/vigilant-volta-pbq80e
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build
        env:
          # Publishable browser key: access is still constrained by Supabase RLS.
          VITE_SUPABASE_URL: https://ycnxgshttjdlsyabhcks.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_kVKaVh057S4L1WNk1J5bxQ_s1NVFFyf

      - name: Exclude private quote artifact
        run: rm -rf dist/cercas

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
